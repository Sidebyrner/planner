# Generate Planner.xcodeproj with: cd apple && xcodegen
name: Planner
options:
  bundleIdPrefix: com.sidebyrner
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  PlannerKit:
    path: PlannerKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Apple developer team used to sign for devices (Xcode > Settings > Accounts).
    DEVELOPMENT_TEAM: H9B7A5KQP3

targets:
  Planner:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Planner
        excludes: ["*.entitlements"]
      - Shared
    dependencies:
      - package: PlannerKit
      - target: PlannerWidget
        destinationFilters: [iOS]
    info:
      path: Planner/Info.plist
      properties:
        CFBundleDisplayName: Planner
        # Keychain group shared with the widget (see Shared/Keychain.swift).
        PlannerKeychainGroup: $(AppIdentifierPrefix)com.sidebyrner.planner.shared
        LSApplicationCategoryType: public.app-category.productivity
        NSCalendarsFullAccessUsageDescription: >-
          Planner reads your calendars so it can plan tasks around your real
          events, and adds the time blocks it books to a "Planner" calendar.
        NSAppTransportSecurity:
          # Lets the app reach a Planner server on localhost or the LAN during development.
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidebyrner.planner
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        # macOS sandbox, with only what Planner needs.
        "ENABLE_APP_SANDBOX[sdk=macosx*]": YES
        "ENABLE_OUTGOING_NETWORK_CONNECTIONS[sdk=macosx*]": YES
        "ENABLE_RESOURCE_ACCESS_CALENDARS[sdk=macosx*]": YES
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        # iOS only: the Keychain group shared with the widget.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Planner/Planner-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Planner/Planner-iOS.entitlements

  PlannerWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - PlannerWidget
      - Shared
      - Planner/Format.swift
      - Planner/Theme.swift
    dependencies:
      - package: PlannerKit
    info:
      path: PlannerWidget/Info.plist
      properties:
        CFBundleDisplayName: Planner
        PlannerKeychainGroup: $(AppIdentifierPrefix)com.sidebyrner.planner.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidebyrner.planner.widget
        CODE_SIGN_ENTITLEMENTS: PlannerWidget/PlannerWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
